# ─── 실제 방문자 IP 복원 (Cloudflare Tunnel) ─────────────────────
# cloudflared 가 같은 NAS(호스트/도커 네트워크)에서 프록시하므로 요청 출발지는 사설 IP.
# 사설 대역에서 온 요청에 한해 CF-Connecting-IP 를 실제 IP 로 신뢰한다.
# (없으면 모든 방문자가 cloudflared IP 하나로 묶여 rate limit 을 함께 나눠 씀)
set_real_ip_from 127.0.0.1;
set_real_ip_from 10.0.0.0/8;
set_real_ip_from 172.16.0.0/12;
set_real_ip_from 192.168.0.0/16;
real_ip_header CF-Connecting-IP;

# ─── DoS 1차 방어 ───────────────────────────────────────────────
# IP 당 /api 요청: 초당 5건 (버스트 20) · 동시 연결 10개
limit_req_zone  $binary_remote_addr zone=api_rate:10m rate=5r/s;
limit_conn_zone $binary_remote_addr zone=per_ip:10m;
limit_req_status  429;
limit_conn_status 429;

server {
    listen 80;
    server_name _;
    server_tokens off;

    root /usr/share/nginx/html;
    index index.html;

    client_max_body_size 8k;          # API 본문은 1KB 미만
    client_body_timeout   10s;        # slowloris 완화
    client_header_timeout 10s;
    keepalive_timeout     15s;
    send_timeout          10s;
    limit_conn per_ip 20;

    # 보안 헤더
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' https://static.cloudflareinsights.com; img-src 'self' data:; style-src 'self' 'unsafe-inline'; font-src 'self'; connect-src 'self' https://cloudflareinsights.com; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;

    location /api/ {
        limit_req zone=api_rate burst=20 nodelay;
        limit_conn per_ip 10;
        limit_except GET POST { deny all; }

        proxy_pass http://backend:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_connect_timeout 3s;
        proxy_read_timeout 10s;
        proxy_send_timeout 10s;
    }

    location = /api/docs { deny all; }       # 운영에서는 API 문서 비공개
    location = /api/openapi.json { deny all; }

    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable" always;
        add_header X-Content-Type-Options "nosniff" always;
        try_files $uri =404;
    }

    location / {
        add_header Cache-Control "no-cache" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self' https://static.cloudflareinsights.com; img-src 'self' data:; style-src 'self' 'unsafe-inline'; font-src 'self'; connect-src 'self' https://cloudflareinsights.com; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;
        try_files $uri $uri/ /index.html;
    }
}
